<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kellerbuch</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f4f2;color:#222}
*{box-sizing:border-box} body{margin:0;background:#f4f4f2}.app{max-width:1050px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{margin:0;font-size:27px}.sub{color:#666;font-size:13px;margin-top:3px}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:600;cursor:pointer;background:#222;color:white}
button.secondary{background:#e5e5e2;color:#222}
nav{display:flex;gap:8px;overflow:auto;margin-bottom:18px}nav button{white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:white;border-radius:16px;padding:17px;box-shadow:0 1px 4px #00000012}
.kpi{font-size:26px;font-weight:700}.muted{color:#777;font-size:13px}
section{display:none}.active{display:block}
.list{display:grid;gap:10px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:15px;align-items:center}
.tank{cursor:pointer}.tank strong{display:block;font-size:17px}.badge{font-size:12px;background:#e9f1e9;border-radius:999px;padding:5px 9px}
form{display:grid;gap:11px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:11px}
label{font-size:13px;color:#555}input,select,textarea{width:100%;padding:11px;border:1px solid #d6d6d2;border-radius:10px;background:#fff;font:inherit}
textarea{min-height:80px}.result{background:#f0f3ef;border-radius:12px;padding:12px;font-weight:600}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}th{color:#666;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#8b2222}
@media(max-width:700px){.grid{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.app{padding:12px}}
</style>
</head>
<body>
<div class="app">
<header>
<div><h1>🍷 Kellerbuch</h1><div class="sub">Digitale Maßnahmenblätter für den Weinkeller</div></div>
<button onclick="show('measure')">＋ Maßnahme</button>
</header>

<nav>
<button onclick="show('home')">Übersicht</button>
<button onclick="show('tanks')">Tanks</button>
<button onclick="show('measure')">Maßnahme erfassen</button>
<button onclick="show('book')">Kellerbuch</button>
</nav>

<section id="home" class="active">
<div class="grid">
<div class="card"><div class="muted">Tanks</div><div class="kpi" id="tankCount">0</div></div>
<div class="card"><div class="muted">Gesamtmenge</div><div class="kpi"><span id="totalLiters">0</span> L</div></div>
<div class="card"><div class="muted">Maßnahmen</div><div class="kpi" id="measureCount">0</div></div>
</div>
<div class="card" style="margin-top:12px"><h3>Letzte Maßnahmen</h3><div id="recent" class="list"></div></div>
</section>

<section id="tanks">
<div class="card">
<div class="row"><h2>Tanks</h2><button onclick="newTank()">＋ Tank</button></div>
<div id="tankList" class="list"></div>
</div>
</section>

<section id="measure">
<div class="card">
<h2>Maßnahme erfassen</h2>
<form onsubmit="saveMeasure(event)">
<div class="cols">
<div><label>Datum</label><input id="mDate" type="date" required></div>
<div><label>Tank</label><select id="mTank" required></select></div>
</div>
<div class="cols">
<div><label>Maßnahme</label><select id="mType"><option>Schwefelung</option><option>Bentonit</option><option>CMC</option><option>Metaweinsäure</option><option>PVPP</option><option>Kupfer</option><option>Filtration</option><option>Entsäuerung</option><option>Verschnitt</option><option>Umfüllung</option><option>Abfüllung</option><option>Sonstiges</option></select></div>
<div><label>Produkt</label><input id="mProduct" placeholder="z. B. Nacalit"></div>
</div>
<div class="cols">
<div><label>Dosierung (pro hl)</label><input id="mDose" type="number" step="0.01" placeholder="30"></div>
<div><label>Einheit</label><select id="mUnit"><option>g/hl</option><option>ml/hl</option><option>l/hl</option><option>kg/hl</option></select></div>
</div>
<div class="result">Benötigte Menge: <span id="calc">–</span></div>
<label>Bemerkung<textarea id="mNote" placeholder="Grund, Beobachtung, Laborwert ..."></textarea></label>
<button>Maßnahme speichern</button>
</form>
</div>
</section>

<section id="book">
<div class="card">
<div class="row"><h2>Kellerbuch</h2><button class="secondary" onclick="exportCSV()">CSV exportieren</button></div>
<div style="overflow:auto"><table><thead><tr><th>Datum</th><th>Tank</th><th>Maßnahme</th><th>Produkt</th><th>Dosierung</th><th>Menge</th></tr></thead><tbody id="bookBody"></tbody></table></div>
</div>
</section>
</div>

<script>
const KEY='kellerbuch-v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{
 tanks:[
  {id:1,no:'Tank 1',wine:'Sauvignon blanc',year:2026,liters:2850,status:'fertig'},
  {id:2,no:'Tank 2',wine:'Weißburgunder',year:2026,liters:5200,status:'fertig'}
 ],
 measures:[]
};
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function show(id){document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');render()}
function render(){
 document.getElementById('tankCount').textContent=data.tanks.length;
 document.getElementById('totalLiters').textContent=data.tanks.reduce((a,t)=>a+Number(t.liters||0),0).toLocaleString('de-AT');
 document.getElementById('measureCount').textContent=data.measures.length;
 document.getElementById('tankList').innerHTML=data.tanks.map(t=>`<div class="card tank"><div class="row"><div><strong>${t.no}</strong><span class="muted">${t.wine} · ${t.year}</span></div><div><b>${Number(t.liters).toLocaleString('de-AT')} L</b><br><span class="badge">${t.status}</span></div></div></div>`).join('');
 document.getElementById('mTank').innerHTML=data.tanks.map(t=>`<option value="${t.id}">${t.no} – ${t.wine} (${t.liters} L)</option>`).join('');
 document.getElementById('recent').innerHTML=data.measures.slice().reverse().slice(0,6).map(m=>`<div class="card"><div class="row"><div><b>${m.type}</b> · ${m.product||'–'}<div class="muted">${m.date} · ${m.tankNo}</div></div><b>${m.amount||'–'}</b></div></div>`).join('') || '<div class="muted">Noch keine Maßnahmen erfasst.</div>';
 document.getElementById('bookBody').innerHTML=data.measures.slice().reverse().map(m=>`<tr><td>${m.date}</td><td>${m.tankNo}</td><td>${m.type}</td><td>${m.product||'–'}</td><td>${m.dose?m.dose+' '+m.unit:'–'}</td><td>${m.amount||'–'}</td></tr>`).join('');
 calc();
}
function calc(){
 const tank=data.tanks.find(t=>t.id==document.getElementById('mTank').value);
 const dose=Number(document.getElementById('mDose').value);
 const unit=document.getElementById('mUnit').value;
 if(!tank||!dose){document.getElementById('calc').textContent='–';return}
 let amount=(Number(tank.liters)/100)*dose;
 let suffix=unit.replace('/hl','');
 document.getElementById('calc').textContent=(amount>=1000? (amount/1000).toLocaleString('de-AT',{maximumFractionDigits:2})+' '+(suffix==='g'?'kg':suffix):amount.toLocaleString('de-AT',{maximumFractionDigits:2})+' '+suffix);
}
['mTank','mDose','mUnit'].forEach(id=>document.getElementById(id).addEventListener('input',calc));
document.getElementById('mDate').value=new Date().toISOString().slice(0,10);
function saveMeasure(e){
 e.preventDefault();
 const tank=data.tanks.find(t=>t.id==document.getElementById('mTank').value);
 const dose=Number(document.getElementById('mDose').value);
 const unit=document.getElementById('mUnit').value;
 let amount='';
 if(dose){let x=tank.liters/100*dose;let base=unit.replace('/hl','');amount=(x>=1000?(x/1000).toFixed(2)+' '+(base==='g'?'kg':base):x.toFixed(2)+' '+base)}
 data.measures.push({date:mDate.value,tankNo:tank.no,type:mType.value,product:mProduct.value,dose,unit,amount,note:mNote.value});
 e.target.reset();mDate.value=new Date().toISOString().slice(0,10);save();show('book');
}
function newTank(){
 const no=prompt('Tanknummer / Bezeichnung:'); if(!no)return;
 const wine=prompt('Wein / Sorte:')||'';
 const liters=Number(prompt('Menge in Liter:')||0);
 const year=Number(prompt('Jahrgang:')||new Date().getFullYear());
 data.tanks.push({id:Date.now(),no,wine,year,liters,status:'aktiv'});save();
}
function exportCSV(){
 const rows=[['Datum','Tank','Maßnahme','Produkt','Dosierung','Menge','Bemerkung'],...data.measures.map(m=>[m.date,m.tankNo,m.type,m.product,m.dose?m.dose+' '+m.unit:'',m.amount,m.note])];
 const csv=rows.map(r=>r.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(';')).join('\\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='kellerbuch.csv';a.click();
}
render();
</script>
</body>
</html>
